<head>

<style>
/* Layout: a single column app. Top: wordmark + script picker. Middle: a settings card. Main: the dialogue as a conversation thread
   (others on the left, you on the right in highlighter yellow). Bottom: a floating action dock. */
:root{
  --bg:#eef2fa; --bg-2:#dfe7f6; --paper:#ffffff; --ink:#152238; --muted:#5d6a84; --line:#dbe2ef;
  --blue:#1e4fa0; --blue-2:#2f6bd1; --on-blue:#ffffff; --blue-soft:#e4ecfb;
  --sun:#ffd84d; --sun-soft:#fff3c4; --sun-ink:#4d3a00; --sun-line:#f0c93a;
  --good:#16804f; --good-soft:#dcf3e6; --bad:#b8432b; --bad-soft:#fbe4de;
  --c1:#2f6bd1; --c2:#c2410c; --c3:#0f8a6a; --c4:#8a3ffc; --c5:#be185d; --c6:#6b7280;
  --shadow:0 1px 2px rgba(21,34,56,.06), 0 6px 20px rgba(21,34,56,.07);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1322; --bg-2:#14213b; --paper:#172238; --ink:#e9eef8; --muted:#9ba8c2; --line:#26334f;
  --blue:#7fb0ff; --blue-2:#9cc2ff; --on-blue:#0d1322; --blue-soft:#1c2c4c;
  --sun:#ffd84d; --sun-soft:#3a3218; --sun-ink:#ffe591; --sun-line:#7a6420;
  --good:#5fd39b; --good-soft:#15392a; --bad:#ff8d74; --bad-soft:#47231b;
  --c1:#7fb0ff; --c2:#ff9b6a; --c3:#4fd1a9; --c4:#b78cff; --c5:#ff7eb6; --c6:#aab3c5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1322; --bg-2:#14213b; --paper:#172238; --ink:#e9eef8; --muted:#9ba8c2; --line:#26334f;
  --blue:#7fb0ff; --blue-2:#9cc2ff; --on-blue:#0d1322; --blue-soft:#1c2c4c;
  --sun:#ffd84d; --sun-soft:#3a3218; --sun-ink:#ffe591; --sun-line:#7a6420;
  --good:#5fd39b; --good-soft:#15392a; --bad:#ff8d74; --bad-soft:#47231b;
  --c1:#7fb0ff; --c2:#ff9b6a; --c3:#4fd1a9; --c4:#b78cff; --c5:#ff7eb6; --c6:#aab3c5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(1200px 380px at 50% -120px, var(--bg-2), transparent 70%),
    var(--bg);
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-block:22px 0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
a{color:var(--blue)}

/* Header */
.top{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;background:var(--blue);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.logo svg{width:26px;height:26px}
h1{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:-.025em;margin:0;line-height:1.05}
h1 span{color:var(--blue)}
.sub{color:var(--muted);margin:2px 0 0;font-size:.92rem}
h2{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0;letter-spacing:-.01em}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.note{font-size:.88rem;color:var(--muted);margin:0}

/* Script picker */
.picker{display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 14px;font-weight:700;font-size:.95rem;box-shadow:var(--shadow);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.tab.add{border-style:dashed;box-shadow:none;background:transparent;color:var(--blue)}
.tools-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;color:var(--ink)}
.pill svg{width:15px;height:15px}
.pill:hover{border-color:var(--blue-2)}

/* Cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px;box-shadow:var(--shadow)}
.group{display:grid;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.who-chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 14px 4px 4px;font-weight:700}
.who-chip[aria-pressed="true"]{border-color:var(--sun-line);background:var(--sun-soft);color:var(--sun-ink)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:480px){.levels{grid-template-columns:1fr}}
.lvl{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.lvl b{grid-row:span 2;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-family:var(--display);font-size:1.05rem}
.lvl span{font-weight:700;font-size:.95rem;line-height:1.2}
.lvl small{color:var(--muted);font-size:.78rem;line-height:1.2}
.lvl[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.lvl[aria-pressed="true"] b{background:var(--blue);color:var(--on-blue)}
.toggle{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.toggle button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:.88rem;font-weight:700;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.split{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.chk input{width:18px;height:18px;accent-color:var(--blue)}
select{font:inherit;font-size:.9rem;padding:5px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.warn{background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* Avatars */
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;color:#fff;flex:none;background:var(--c, var(--c6))}
:root:not([data-theme="light"]) .av{color:#0d1322}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .av{color:#fff} }
:root[data-theme="light"] .av{color:#fff}

/* Conversation */
.thread{display:flex;flex-direction:column;gap:14px;padding:4px 0 8px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%;animation:pop .25s ease-out}
.msg.own{align-self:flex-end;flex-direction:row-reverse}
.msg .col{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.own .col{align-items:flex-end}
.name{font-size:.75rem;font-weight:700;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.06em}
.msg.own .name{color:var(--sun-ink)}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.msg.own .bubble{background:var(--sun-soft);border-color:var(--sun-line);border-radius:18px 18px 6px 18px}
.msg.current .bubble{box-shadow:0 0 0 3px color-mix(in srgb, var(--blue-2) 35%, transparent), var(--shadow)}
.sv{margin:0;font-size:1.1rem;line-height:1.6;cursor:pointer;overflow-wrap:anywhere}
.en{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:.93rem;color:var(--blue);font-style:italic}
.msg.own .en{border-top-color:var(--sun-line)}
.en.err{color:var(--bad);font-style:normal}
.dash{letter-spacing:.14em;color:var(--muted)}
.gap{display:inline-block;border:0;border-bottom:2px solid currentColor;background:color-mix(in srgb, var(--blue-2) 14%, transparent);min-width:2.2ch;height:1.25em;vertical-align:-0.2em;padding:0;margin:0 1px;border-radius:4px 4px 0 0}
.gap:hover{background:color-mix(in srgb, var(--blue-2) 28%, transparent)}
.blank{display:flex;align-items:center;gap:10px;color:var(--sun-ink);font-size:.95rem}
.blank svg{width:22px;height:22px;flex:none}
.msg.own.hidden .bubble{background:transparent;border:2px dashed var(--sun-line);box-shadow:none}
.mini{display:flex;gap:6px;padding:0 4px}
.mini button{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:28px;min-width:28px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.75rem;font-weight:700;color:var(--muted)}
.mini button:hover{color:var(--blue);border-color:var(--blue-2)}
.mini svg{width:14px;height:14px}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.no{background:var(--bad-soft);color:var(--bad)}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Empty / done */
.hint-card{text-align:center;padding:26px 18px}
.done{display:grid;justify-items:center;gap:8px;padding:22px 16px;text-align:center}
.ring{width:120px;height:120px}
.ring text{font-family:var(--display);font-weight:800;fill:var(--ink)}

/* Dock */
.dock{position:sticky;bottom:0;margin-top:4px;padding:10px 0 calc(14px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top, var(--bg) 70%, transparent)}
.dock-inner{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 10px 10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{flex:1 1 120px;min-width:0}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg, var(--blue), var(--blue-2));border-radius:3px;transition:width .3s}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:1rem;background:var(--blue);color:var(--on-blue)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--paper)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.danger{background:var(--bad);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:44px;padding:11px 0;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}

/* Editor */
label.f{display:grid;gap:6px;font-weight:700;font-size:.92rem}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{min-height:260px;font-size:.98rem;line-height:1.55;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);border-radius:999px;padding:3px 10px 3px 3px;font-size:.85rem;font-weight:700}
.chip .av{width:22px;height:22px;font-size:.65rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.sharebox{display:flex;gap:8px;flex-wrap:wrap}
.sharebox input{flex:1 1 220px;min-width:0;font-size:.85rem}
/* Hard words */
.toggle.big{display:flex;align-self:stretch}
.toggle.big button{flex:1;padding:9px 12px;font-size:.95rem}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.95rem}
.wchip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.flash{justify-items:center;text-align:center;padding:30px 18px;min-height:250px;align-content:center;gap:14px}
.fw{font-family:var(--display);font-weight:800;font-size:clamp(2rem, 8vw, 2.8rem);letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.fw.en-word{color:var(--blue)}
.answer{font-size:1.35rem;font-weight:700;color:var(--blue);overflow-wrap:anywhere}
.answer.sv-ans{font-family:var(--display);font-size:1.9rem;color:var(--ink)}
.ctx{font-size:1rem;color:var(--muted);max-width:46ch;margin:0;overflow-wrap:anywhere}
.ctx mark{background:var(--sun-soft);color:var(--sun-ink);border-radius:4px;padding:0 3px;font-weight:700}
.blankw{display:inline-block;min-width:4ch;border-bottom:2px solid currentColor}
.mini.center{justify-content:center}

/* Compact settings + touch sizing */
.card.compact{padding:12px;gap:10px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crow .csum{flex:1 1 auto;min-width:0;color:var(--muted);font-size:.88rem;font-weight:700}
.who-chip.static{cursor:default}
.card.compact .toggle.big button{padding:8px 6px;font-size:.85rem}
.card > .btn{justify-self:start}
@media (pointer: coarse){
  .mini button{height:38px;min-width:38px;padding:0 12px;font-size:.8rem}
  .mini svg{width:17px;height:17px}
  .gap{height:1.6em;min-width:3ch;vertical-align:-0.45em}
  .wchip{padding:7px 14px}
  .chk input{width:22px;height:22px}
  .pill{padding:9px 14px}
  .toggle button{padding:9px 12px}
  select{padding:8px 10px}
}
@media (max-width:560px){
  .levels{grid-template-columns:repeat(3,1fr)}
  .lvl{grid-template-columns:1fr;justify-items:center;text-align:center;padding:10px 6px;gap:4px}
  .lvl b{grid-row:auto}
  .lvl small{display:none}
  .lvl span{font-size:.82rem}
  .dock-inner{padding:8px 8px 8px 12px;gap:8px}
  .progress{flex:1 1 70px}
  .btn{padding:11px 14px}
  .card{padding:14px;border-radius:16px}
  .msg{max-width:100%}
  .sv{font-size:1.05rem}
}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:8px 0 20px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="wrap" id="app"></div>

<script>
(() => {
"use strict";

/* ---------- storage (this browser only) ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("rt:" + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("rt:" + k, JSON.stringify(v)); return true; }catch{ return false; } }
};
const MAX_TEXT = 40000, MAX_TITLE = 60;

/* ---------- example script ---------- */
const DEMO = {
  id: "demo", demo: true, title: "Esimerkki: Kahvilassa",
  text: `Emma: Hej! Vad vill du ha?
Leo: Hej. Jag tar en kaffe och en kanelbulle, tack.
Emma: Vill du ha mjölk i kaffet?
Leo: Ja, lite mjölk. Hur mycket kostar det?
Emma: Det blir sex euro och femtio cent.
Leo: Varsågod. Har ni något vegetariskt att äta också?
Emma: Ja, vi har en smörgås med ost och tomat.
Leo: Perfekt, då tar jag en sådan också.
Emma: Vill du äta här eller ta med?
Leo: Jag äter här. Tack så mycket!`
};
const DEMO_TR = [
  "Hi! What would you like?",
  "Hi. I'll have a coffee and a cinnamon bun, please.",
  "Would you like milk in your coffee?",
  "Yes, a little milk. How much does it cost?",
  "That will be six euros and fifty cents.",
  "Here you go. Do you also have something vegetarian to eat?",
  "Yes, we have a sandwich with cheese and tomato.",
  "Perfect, then I'll have one of those too.",
  "Would you like to eat here or take away?",
  "I'll eat here. Thank you very much!"
];

/* ---------- parsing ---------- */
function parse(text){
  const out = [];
  for (const raw of String(text || "").slice(0, MAX_TEXT).split(/\r?\n/)){
    const s = raw.trim();
    if (!s) continue;
    const m = s.match(/^([^:]{1,40}?)\s*:\s*(.*)$/);
    if (m && m[1].trim().split(/\s+/).length <= 3 && !/^https?$/i.test(m[1])){
      out.push({ speaker: m[1].trim(), text: m[2].trim() });
    } else if (out.length){
      const last = out[out.length - 1];
      last.text += (last.text ? " " : "") + s;
    } else {
      out.push({ speaker: "?", text: s });
    }
  }
  return out.filter(l => l.text);
}
function speakersOf(lines){
  const seen = [];
  for (const l of lines) if (!seen.includes(l.speaker)) seen.push(l.speaker);
  return seen;
}

/* ---------- state ---------- */
function cleanScripts(v){
  if (!Array.isArray(v)) return [];
  return v.filter(s => s && typeof s.id === "string" && typeof s.text === "string")
          .map(s => ({ id: s.id.slice(0, 40), title: String(s.title || "").slice(0, MAX_TITLE), text: s.text.slice(0, MAX_TEXT), createdAt: +s.createdAt || 0 }));
}
const S = {
  scripts: cleanScripts(LS.get("scripts", [])),
  sel: LS.get("sel", null),
  level: [1, 2, 3].includes(LS.get("level", 1)) ? LS.get("level", 1) : 1,
  hint: LS.get("hint", "initials") === "gaps" ? "gaps" : "initials",
  mode: LS.get("mode", "step") === "all" ? "all" : "step",
  autoRead: !!LS.get("autoRead", false),
  rate: LS.get("rate", 0.9) == 0.7 ? 0.7 : 0.9,
  tab: LS.get("tab", "lines") === "words" ? "words" : "lines",
  settingsOpen: false,
  dir: LS.get("dir", "sv-en") === "en-sv" ? "en-sv" : "sv-en",
  cards: null,
  view: "practice",
  editId: null, confirmDelete: false,
  share: null, incoming: null,
  step: { pos: 0, revealed: false, results: {} },
  openTr: new Set(), wordRev: new Set(), lineRev: new Set(),
  trMem: Object.create(null), trState: Object.create(null)
};
{ const st = LS.get("tr", {}); if (st && typeof st === "object") for (const k in st) if (typeof st[k] === "string") S.trMem[k] = st[k]; }
parse(DEMO.text).forEach((l, i) => { S.trMem[l.text] = DEMO_TR[i]; });

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const allScripts = () => S.scripts.length ? S.scripts : [DEMO];
function current(){ const list = allScripts(); return list.find(s => s.id === S.sel) || list[0]; }
const roleKey = id => "role:" + id;
const getRole = script => LS.get(roleKey(script.id), null);
const saveScripts = () => LS.set("scripts", S.scripts);
function resetStep(){
  S.step = { pos: 0, revealed: false, results: {} };
  S.wordRev.clear(); S.lineRev.clear(); S.openTr.clear(); S.share = null; S.cards = null;
}

/* ---------- share links (the script travels inside the link's #hash, never sent to a server) ---------- */
function encodeShare(script){
  const bytes = new TextEncoder().encode(JSON.stringify({ t: script.title, x: script.text }));
  let bin = ""; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeShare(str){
  try{
    if (str.length > MAX_TEXT * 2) return null;
    const b64 = str.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const obj = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!obj || typeof obj.x !== "string" || !parse(obj.x).length) return null;
    return { title: String(obj.t || "Jaettu käsikirjoitus").slice(0, MAX_TITLE), text: obj.x.slice(0, MAX_TEXT) };
  }catch{ return null; }
}
const shareUrl = script => location.href.split("#")[0] + "#k=" + encodeShare(script);

/* ---------- translation (MyMemory, cached in this browser) ---------- */
function decodeEntities(s){
  return new DOMParser().parseFromString("<!doctype html><body>" + s, "text/html").body.textContent || "";
}
async function translate(text){
  if (S.trMem[text] || S.trState[text] === "loading") return;
  S.trState[text] = "loading"; render();
  try{
    const url = "https://api.mymemory.translated.net/get?langpair=sv|en&q=" + encodeURIComponent(text.slice(0, 480));
    const r = await fetch(url, { credentials: "omit", referrerPolicy: "no-referrer" });
    const j = await r.json();
    const out = j && j.responseData && j.responseData.translatedText;
    if (typeof out !== "string" || !out || (j.responseStatus && +j.responseStatus !== 200)) throw new Error("bad");
    const clean = decodeEntities(out).slice(0, 2000);
    S.trMem[text] = clean;
    delete S.trState[text];
    const stored = LS.get("tr", {}); stored[text] = clean; LS.set("tr", stored);
  }catch{
    S.trState[text] = "error";
  }
  render();
}
const gtLink = text => "https://translate.google.com/?sl=sv&tl=en&op=translate&text=" + encodeURIComponent(text);

/* ---------- hints ---------- */
function tokens(text){
  return text.split(/(\s+)/).filter(t => t !== "").map(t => {
    if (/^\s+$/.test(t)) return { sp: true };
    const m = t.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}'’\-]*)(.*)$/u) || ["", t, "", ""];
    return { pre: m[1], w: m[2], post: m[3] };
  });
}
function hintHTML(i, text, type){
  let wi = 0;
  const toks = tokens(text);
  const wordCount = toks.filter(t => !t.sp && t.w).length;
  return toks.map(tok => {
    if (tok.sp) return " ";
    if (!tok.w) return esc(tok.pre + tok.post);
    const idx = wi++;
    let mid;
    if (type === "initials"){
      mid = esc(tok.w[0]) + '<span class="dash">' + "_".repeat(Math.max(0, tok.w.length - 1)) + "</span>";
    } else {
      const hide = wordCount > 1 && idx % 2 === 1;
      const k = i + ":" + idx;
      mid = hide && !S.wordRev.has(k)
        ? `<button class="gap" data-action="word" data-k="${k}" style="width:${tok.w.length + 1}ch" aria-label="Näytä piilotettu sana"></button>`
        : esc(tok.w);
    }
    return esc(tok.pre) + mid + esc(tok.post);
  }).join("");
}

const isHard = w => w.length >= 7 || /[åäö]/.test(w) || /(sj|skj|stj|tj|kj|sk[eiyäö]|rs|rt|rd|rn|ng)/.test(w);
const normWord = w => w.toLowerCase().replace(/^['’-]+|['’-]+$/g, "");
function wordsFor(lines, role, speakers){
  const names = new Set(speakers.map(s => s.toLowerCase()));
  const map = new Map();
  for (const l of lines){
    if (l.speaker !== role) continue;
    for (const t of tokens(l.text)){
      if (t.sp || !t.w) continue;
      const w = normWord(t.w);
      if (w.length < 3 || STOP.has(w) || names.has(w) || /^\d+$/.test(w)) continue;
      if (!map.has(w)) map.set(w, l.text);
    }
  }
  return map;
}
const wKey = (script, role) => "words:" + script.id + ":" + role;
function selectedWords(script, role, map){
  const saved = LS.get(wKey(script, role), null);
  if (Array.isArray(saved)) return saved.filter(w => typeof w === "string" && w).map(w => w.slice(0, 40)).slice(0, 300);
  return [...map.keys()].filter(isHard);
}
const setSelected = (script, role, arr) => LS.set(wKey(script, role), [...new Set(arr)].slice(0, 300));
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ctxHTML(sentence, word, mode){
  return tokens(sentence).map(t => {
    if (t.sp) return " ";
    if (t.w && normWord(t.w) === word)
      return esc(t.pre) + (mode === "mark" ? `<mark>${esc(t.w)}</mark>` : `<span class="blankw" aria-label="piilotettu sana"></span>`) + esc(t.post);
    return esc(t.pre + t.w + t.post);
  }).join("");
}
function cardContext(){

    }
    h += `<div class="msg ${own ? "own" : ""} ${isCur ? "current" : ""} ${show === "hidden" ? "hidden" : ""}">${avatar(speakers, l.speaker)}<div class="col">`;
    h += `<span class="name">${own ? "Sinä · " : ""}${esc(l.speaker)}</span><div class="bubble">`;
    if (show === "hidden") h += `<div class="blank">${I.mic}<span>Sinun vuorosi. Sano repliikki ääneen ulkomuistista.</span></div>`;
    else if (show === "full") h += `<p class="sv" data-action="tr" data-i="${i}" title="Näytä käännös">${esc(l.text)}</p>`;
    else h += `<p class="sv" data-action="tr" data-i="${i}">${hintHTML(i, l.text, show)}</p>`;
    if (S.openTr.has(i)){
      const en = S.trMem[l.text], st = S.trState[l.text];
      if (en) h += `<p class="en">${esc(en)}</p>`;
      else if (st === "loading") h += `<p class="en">Käännetään…</p>`;
      else if (st === "error") h += `<p class="en err">Käännös ei onnistunut. <a href="${esc(gtLink(l.text))}" target="_blank" rel="noopener noreferrer">Avaa Google Kääntäjässä</a></p>`;
    }
    h += `</div><div class="mini">`;
    if (step && own && i < pos && S.step.results[i] !== undefined)
      h += S.step.results[i] ? `<span class="badge ok">Osasin</span>` : `<span class="badge no">Harjoittelen vielä</span>`;
    if (show !== "full") h += `<button data-action="tr" data-i="${i}" aria-label="Näytä englanninkielinen käännös">EN</button>`;
    if (show === "full" && canSpeak) h += `<button data-action="speak" data-i="${i}" aria-label="Kuuntele ruotsiksi">${I.speak}</button>`;
    if (!step && own && show !== "full") h += `<button data-action="revealLine" data-i="${i}">${I.eye}Näytä</button>`;
    h += `</div></div></div>`;
  });
  if (finished){
    const ownIdx = lines.map((l, i) => l.speaker === role ? i : -1).filter(i => i >= 0);
    const graded = ownIdx.filter(i => S.step.results[i] !== undefined);
    const ok = graded.filter(i => S.step.results[i]).length;
    h += `<div class="card done"><span class="label">Käsikirjoitus läpi</span>`;
    if (graded.length){
      const frac = ok / graded.length, C = 2 * Math.PI * 50;
      h += `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${ok} / ${graded.length} osattu">
          <circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle cx="60" cy="60" r="50" fill="none" stroke="${frac === 1 ? "var(--good)" : "var(--blue-2)"}" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/>
          <text x="60" y="68" text-anchor="middle" font-size="26">${ok}/${graded.length}</text></svg>
        <h2>${frac === 1 ? "Täydellistä! Kokeile seuraavaa tasoa." : frac >= .6 ? "Hyvin menee! Vielä kierros." : "Harjoitus tekee mestarin. Uudestaan!"}</h2>`;
    } else {
      h += `<h2>Hyvä! Luit koko dialogin läpi.</h2><p class="note">Kun tuntuu tutulta, vaihda tasolle ${Math.min(3, S.level + 1)}.</p>`;
    }
    h += `</div>`;
  }
  h += `</section>`;

  if (step){
    const total = lines.length;
    const pct = Math.round(Math.min(pos, total) / Math.max(1, total) * 100);
    h += `<div class="dock"><div class="dock-inner"><div class="progress"><span class="label">Vuoro ${Math.min(pos + 1, total)} / ${total}</span><div class="meter"><i style="width:${pct}%"></i></div></div><div class="btns">`;
    if (pos > 0 && !finished) h += `<button class="btn sec icon-btn" data-action="restart" aria-label="Aloita alusta" title="Aloita alusta">${I.restart}</button>`;
    if (finished) h += `<button class="btn" data-action="restart" id="primary">Aloita alusta</button>`;
    else {
      const own = lines[pos].speaker === role;
      if (!own || S.level === 1) h += `<button class="btn" data-action="next" id="primary">Seuraava</button>`;
      else if (!S.step.revealed) h += `<button class="btn" data-action="reveal" id="primary">Näytä repliikki</button>`;
      else h += `<button class="btn bad" data-action="grade" data-v="0">Harjoittelen vielä</button><button class="btn good" data-action="grade" data-v="1" id="primary">Osasin</button>`;
    }
    h += `</div></div></div>`;
  }
  h += `<footer>Käsikirjoitukset ja asetukset tallentuvat vain tähän selaimeen. Käännökset: MyMemory.</footer>`;
  app.innerHTML = h;
}

/* ---------- editor ---------- */
function openEditor(id){
  const s = id ? S.scripts.find(x => x.id === id) : null;
  S.view = "edit"; S.editId = id || null; S.confirmDelete = false;
  app.innerHTML = header + `
    <section class="card">
      <h2>${s ? "Muokkaa käsikirjoitusta" : "Uusi käsikirjoitus"}</h2>
      <label class="f">Nimi<input type="text" id="edTitle" maxlength="${MAX_TITLE}" placeholder="esim. Käsikirjoitus 1: Matkalla Tukholmaan" value="${s ? esc(s.title || "") : ""}"></label>
      <label class="f">Käsikirjoitus ruotsiksi
        <textarea id="edText" maxlength="${MAX_TEXT}" placeholder="Anna: Hej! Hur mår du?&#10;Mikko: Bra, tack. Och du?&#10;Sara: Hej allihopa!">${s ? esc(s.text || "") : ""}</textarea></label>
      <p class="note">Jokainen vuoro omalle rivilleen muodossa <b>Nimi: repliikki</b>. Rivi ilman nimeä liitetään edelliseen vuoroon.</p>
      <div class="group" id="edPreview"></div>
      <p class="en err" id="edErr" hidden></p>
      <div class="actions">
        <button class="btn" id="edSave">Tallenna</button>
        <button class="btn sec" id="edCancel">Peruuta</button>
        ${s ? `<button class="btn bad" id="edDelete">Poista</button>` : ""}
      </div>
    </section>`;
  const t = document.getElementById("edText");
  const upd = () => {
    const lines = parse(t.value), sp = speakersOf(lines);
    const counts = sp.map(n => `<span class="chip">${avatar(sp, n)}${esc(n)} · ${lines.filter(l => l.speaker === n).length}</span>`).join("");
    document.getElementById("edPreview").innerHTML = lines.length
      ? `<span class="label">Tunnistettiin ${lines.length} vuoroa</span><div class="chips">${counts}</div>` +
        (sp.length < 2 ? `<div class="warn">Löytyi vain yksi puhuja. Tarkista, että rivit ovat muodossa Nimi: repliikki.</div>` : "") +
        (sp.includes("?") ? `<div class="warn">Ensimmäiseltä riviltä puuttuu puhujan nimi.</div>` : "")
      : `<span class="note">Liitä käsikirjoitus yllä olevaan kenttään.</span>`;
  };
  t.addEventListener("input", upd); upd();
  document.getElementById("edCancel").onclick = closeEditor;
  document.getElementById("edSave").onclick = () => {
    const title = document.getElementById("edTitle").value.trim().slice(0, MAX_TITLE) || "Nimetön käsikirjoitus";
    const text = t.value.replace(/\r\n/g, "\n").trim().slice(0, MAX_TEXT);
    if (!parse(text).length){ showEdErr("Käsikirjoitus on tyhjä."); return; }
    if (S.editId){
      const s2 = S.scripts.find(x => x.id === S.editId);
      if (s2){ s2.title = title; s2.text = text; }
    } else {
      const ns = { id: newId(), title, text, createdAt: Date.now() };
      S.scripts.push(ns); S.editId = ns.id;
    }
    if (!saveScripts()){ showEdErr("Tallentaminen ei onnistunut. Selaimesi saattaa estää tallennuksen (esim. yksityinen ikkuna)."); return; }
    S.sel = S.editId; LS.set("sel", S.sel);
    closeEditor();
  };
  const del = document.getElementById("edDelete");
  if (del) del.onclick = () => {
    if (!S.confirmDelete){ S.confirmDelete = true; del.textContent = "Vahvista poisto"; del.className = "btn danger"; return; }
    S.scripts = S.scripts.filter(x => x.id !== S.editId); saveScripts();
    S.sel = null; LS.set("sel", null); closeEditor();
  };
  document.getElementById("edTitle").focus();
}
function showEdErr(msg){ const e = document.getElementById("edErr"); if (e){ e.textContent = msg; e.hidden = false; } }
function closeEditor(){ S.view = "practice"; resetStep(); render(); window.scrollTo(0, 0); }

/* ---------- step logic ---------- */
function afterMove(){
  const lines = parse(current().text);
  const role = getRole(current());
  const cur = lines[S.step.pos];
  render();
  const el = app.querySelector(".msg.current") || app.querySelector(".done");
  if (el) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  if (cur && cur.speaker !== role && S.autoRead) speak(cur.text);
}
function next(){ S.step.pos++; S.step.revealed = false; afterMove(); }

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t || !app.contains(t)) return;
  const script = current();
  switch (t.dataset.action){
    case "pick": S.sel = t.dataset.id; LS.set("sel", S.sel); resetStep(); render(); break;
    case "new": openEditor(null); break;
    case "edit": openEditor(script.id); break;
    case "share": S.share = S.share ? null : shareUrl(script); render(); break;
    case "copy": {
      const inp = document.getElementById("shareInput");
      const done = () => { const b = document.getElementById("copyBtn"); if (b) b.textContent = "Kopioitu ✓"; };
      if (navigator.clipboard) navigator.clipboard.writeText(S.share).then(done, () => inp.select());
      else inp.select();
      break;
    }
    case "import": {
      const ns = { id: newId(), title: S.incoming.title, text: S.incoming.text, createdAt: Date.now() };
      const dup = S.scripts.find(x => x.text === ns.text);
      if (dup) S.sel = dup.id; else { S.scripts.push(ns); saveScripts(); S.sel = ns.id; }
      LS.set("sel", S.sel); S.incoming = null; resetStep(); render(); break;
    }
    case "skipImport": S.incoming = null; render(); break;
    case "role": LS.set(roleKey(script.id), t.dataset.v); resetStep(); afterMove(); break;
    case "level": S.level = +t.dataset.v; LS.set("level", S.level); resetStep(); render(); break;
    case "hint": S.hint = t.dataset.v; LS.set("hint", S.hint); S.wordRev.clear(); render(); break;
    case "mode": S.mode = t.dataset.v; LS.set("mode", S.mode); resetStep(); render(); break;
    case "tr": {
      const i = +t.dataset.i, line = parse(script.text)[i];
      if (!line) break;
      if (S.openTr.has(i)) S.openTr.delete(i); else S.openTr.add(i);
      if (S.openTr.has(i) && !S.trMem[line.text]){ if (S.trState[line.text] === "error") delete S.trState[line.text]; translate(line.text); }
      render(); break;
    }
    case "speak": { const line = parse(script.text)[+t.dataset.i]; if (line) speak(line.text); break; }
    case "word": S.wordRev.add(t.dataset.k); render(); break;
    case "revealLine": S.lineRev.add(+t.dataset.i); render(); break;
    case "next": next(); break;
    case "reveal": S.step.revealed = true; render(); break;
    case "grade": S.step.results[S.step.pos] = t.dataset.v === "1"; next(); break;
    case "restart": resetStep(); afterMove(); break;
    case "settings": S.settingsOpen = !S.settingsOpen; render(); if (!S.settingsOpen){ const el = app.querySelector(".msg.current"); if (el) el.scrollIntoView({ block: "center" }); } break;
    case "tab": S.tab = t.dataset.v === "words" ? "words" : "lines"; LS.set("tab", S.tab); S.cards = null; render(); window.scrollTo(0, 0); break;
    case "dir": S.dir = t.dataset.v === "en-sv" ? "en-sv" : "sv-en"; LS.set("dir", S.dir); render(); break;
    case "wtoggle": case "wall": case "wnone": case "wauto": case "wadd": {
      const { role, map } = cardContext();
      if (!role) break;
      let sel = selectedWords(script, role, map);
      const a = t.dataset.action;
      if (a === "wtoggle"){ const w = t.dataset.w; sel = sel.includes(w) ? sel.filter(x => x !== w) : [...sel, w]; }
      else if (a === "wall") sel = [...new Set([...map.keys(), ...sel])];
      else if (a === "wnone") sel = [];
      else if (a === "wauto") sel = [...map.keys()].filter(isHard);
      else {
        const inp = document.getElementById("wordInput");
        const w = normWord((inp && inp.value || "").trim().replace(/\s+/g, " ")).slice(0, 40);
        if (!w) break;
        if (!sel.includes(w)) sel = [...sel, w];
      }
      setSelected(script, role, sel); render();
      if (a === "wadd"){ const inp = document.getElementById("wordInput"); if (inp) inp.focus(); }
      break;
    }
    case "cstart": startCards(t.dataset.v === "missed"); break;
    case "cflip": if (S.cards){ S.cards.flipped = true; render(); const w = S.cards.list[S.cards.i]; if (S.dir === "en-sv" && S.autoRead && w) speak(w); } break;
    case "cgrade": {
      const C = S.cards; if (!C) break;
      const w = C.list[C.i];
      if (t.dataset.v !== "1"){ C.firstMiss.add(w); C.list.push(w); }
      C.i++; C.flipped = false; afterCard(); break;
    }
    case "cquit": S.cards = null; render(); break;
    case "speakw": speak(t.dataset.w); break;
  }
});
app.addEventListener("change", e => {
  if (e.target.id === "autoRead"){ S.autoRead = e.target.checked; LS.set("autoRead", S.autoRead); }
  if (e.target.id === "rate"){ S.rate = e.target.value === "0.7" ? 0.7 : 0.9; LS.set("rate", S.rate); }
});
document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "wordInput" && e.key === "Enter"){
    e.preventDefault(); app.querySelector('[data-action="wadd"]')?.click(); return;
  }
  if (S.view !== "practice" || e.repeat) return;
  if (/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(document.activeElement?.tagName || "")) return;
  if (e.key === " " || e.key === "Enter"){
    const p = document.getElementById("primary");
    if (p){ e.preventDefault(); p.click(); }
  }
});

/* ---------- boot ---------- */
const m = location.hash.match(/^#k=([A-Za-z0-9_-]+)$/);
if (m){
  S.incoming = decodeShare(m[1]);
  try{ history.replaceState(null, "", location.pathname + location.search); }catch{}
}
render();
})();
</script>
</body>
</html>
